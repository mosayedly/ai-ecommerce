name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django check
        env:
          DJANGO_SECRET_KEY: ci-test-key-not-for-production
          DEBUG: 'True'
          DB_NAME: ecommerce_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          AI_PROVIDER: deepseek
          DEEPSEEK_API_KEY: ''
        run: python manage.py check

      - name: Run migrations (SQLite)
        env:
          DJANGO_SECRET_KEY: ci-test-key-not-for-production
          DEBUG: 'True'
          AI_PROVIDER: deepseek
          DEEPSEEK_API_KEY: ''
        run: |
          # Force SQLite for CI to avoid needing Postgres
          python -c "import os; os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings'); import django; django.setup()"
          python manage.py migrate --run-syncdb || true
