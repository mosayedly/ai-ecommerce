{% comment %}Renders one form field: label, widget, help text and errors.{% endcomment %}
<div class="form-group">
    <label for="{{ field.id_for_label }}">
        {{ field.label }}{% if field.field.required %} <span class="required-mark">*</span>{% endif %}
    </label>
    {{ field }}
    {% if field.help_text %}<span class="help">{{ field.help_text }}</span>{% endif %}
    {% for error in field.errors %}<p class="form-errors">{{ error }}</p>{% endfor %}
</div>
